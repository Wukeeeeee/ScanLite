# 每次改动必须递增 versionCode（见 .workbuddy/memory/MEMORY.md）
# 宿主内存只有 16G，常被其它程序占满 → Gradle 会在 compileReleaseKotlin 被 OOM kill
# （hs_err: Native memory allocation (malloc) failed ... ChunkPool::allocate）。
# 对策：关掉 C2（TieredStopAtLevel=1）大幅降低 JIT arena 占用，并压缩堆/code cache。
# 若编译太慢或报 heap 不足，再按注释里的配置回调。
org.gradle.jvmargs=-Xmx768m -Xms64m -XX:+UseSerialGC -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -Dfile.encoding=UTF-8
# 充足内存时的默认档：
# org.gradle.jvmargs=-Xmx1400m -Xms64m -XX:+UseSerialGC -XX:MaxMetaspaceSize=448m -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
# 若报 insufficient memory / mmap failed（系统内存紧张），换成下面这行：
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.java.home=D:/jdk17
